<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b16">
    <title>Nova — Advanced AI Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand-mark"><span></span><span></span><span></span></div>
                <div><strong>nova</strong><small>AI workspace</small></div>
            </div>

            <button class="new-chat" id="new-chat-btn" type="button">
                <span class="plus">+</span> New conversation <kbd>⌘ K</kbd>
            </button>

            <nav class="side-nav" aria-label="Workspace">
                <a class="nav-item active" href="#chat"><span class="nav-icon">✦</span> Chat <span class="nav-dot"></span></a>
                <a class="nav-item" href="#knowledge"><span class="nav-icon">◈</span> Knowledge base</a>
            </nav>

            <div class="conversation-heading"><span>Recent conversations</span><button id="refresh-conversations" type="button" aria-label="Refresh conversations">↻</button></div>
            <div class="conversation-list" id="conversation-list"></div>

            <div class="sidebar-footer">
                <div class="provider-card"><span class="pulse"></span><div><strong id="provider-label">AI systems ready</strong><small id="provider-detail">Checking services...</small></div></div>
                <div class="footer-links"><span>Nova v1.0</span><button id="theme-btn" type="button" aria-label="Toggle theme">◐</button></div>
            </div>
        </aside>

        <main class="workspace" id="chat">
            <header class="topbar">
                <div class="mobile-brand"><div class="brand-mark"><span></span><span></span><span></span></div><strong>nova</strong></div>
                <div class="model-select"><span class="model-indicator"></span><span>Nova Intelligence</span><span class="chevron">⌄</span></div>
                <div class="top-actions"><button id="export-btn" type="button" title="Export conversation">⇩ <span>Export</span></button><button id="mobile-menu-btn" class="mobile-only" type="button" aria-label="Open menu">☰</button></div>
            </header>

            <section class="chat-area">
                <div class="messages" id="chat-box" aria-live="polite"></div>
                <div class="typing" id="typing"><span class="typing-avatar">✦</span><span>Nova is thinking</span><i></i><i></i><i></i></div>
            </section>

            <footer class="composer-wrap">
                <div class="suggestions" id="suggestions">
                    <button type="button" data-prompt="Give me a clear plan for launching a new product">✧ Launch plan</button>
                    <button type="button" data-prompt="What can you help me with?">◎ Explore capabilities</button>
                    <button type="button" data-prompt="Summarize the latest technology trends">⌁ Latest trends</button>
                </div>
                <div class="composer">
                    <button class="icon-button" type="button" title="Attach a file" aria-label="Attach a file">＋</button>
                    <textarea id="message" rows="1" placeholder="Message Nova..." autocomplete="off"></textarea>
                    <div class="composer-actions"><span class="shortcut">Shift + Enter for new line</span><button class="send-button" id="send-btn" type="button" aria-label="Send message">↑</button></div>
                </div>
                <p class="disclaimer">Nova can make mistakes. Check important information.</p>
            </footer>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
